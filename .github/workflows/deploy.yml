name: Deploy to Tencent Cloud Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source and deploy
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.TENCENT_SERVER_USER }}
          DEPLOY_PORT: ${{ secrets.TENCENT_SERVER_PORT || 22 }}
          DEPLOY_KEY: ${{ secrets.TENCENT_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          ssh_args=(-i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/a-mini-report/server'
          scp "${ssh_args[@]}" docker-compose.prod.yml .env.production.example README.md "$DEPLOY_USER@$DEPLOY_HOST:/opt/a-mini-report/"
          scp -r "${ssh_args[@]}" server "$DEPLOY_USER@$DEPLOY_HOST:/opt/a-mini-report/"
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'set -e; cd /opt/a-mini-report; if [ ! -f .env ]; then app_password=$(openssl rand -hex 24); root_password=$(openssl rand -hex 24); umask 077; printf "MYSQL_PASSWORD=%s\nMYSQL_ROOT_PASSWORD=%s\n" "$app_password" "$root_password" > .env; fi; docker compose --env-file .env -f docker-compose.prod.yml up -d --build; docker image prune -f'
          rm -f "$RUNNER_TEMP/deploy_key"
