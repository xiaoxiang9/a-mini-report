server {
    listen 80;
    server_name myxiang.online www.myxiang.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name myxiang.online www.myxiang.online;

    root /opt/a-mini-report/web/dist;
    index index.html;

    ssl_certificate /www/server/nginx/conf/cert/myxiang.online_bundle.crt;
    ssl_certificate_key /www/server/nginx/conf/cert/myxiang.online.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
