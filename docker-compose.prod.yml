services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: a_stock_platform
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://app:${MYSQL_PASSWORD}@mysql:3306/a_stock_platform
      PORT: 3000
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      TASK_ADMIN_TOKEN: ${TASK_ADMIN_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  scheduler:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://app:${MYSQL_PASSWORD}@mysql:3306/a_stock_platform
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      TASK_ADMIN_TOKEN: ${TASK_ADMIN_TOKEN}
    command: ["python", "-m", "app.scheduler.stock_sync"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
