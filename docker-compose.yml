services:
  mysql:
    image: mysql:8.4
    container_name: a-stock-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: a_stock_platform
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - a_stock_platform_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp_password"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  a_stock_platform_mysql:
